<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danielle Choster — Срань.dev</title>
<meta name="description" content="Игры, проекты и ссылки Danielle Choster (Срань.dev)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231E6FE0'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-weight='800' font-size='30' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="Danielle Choster — Срань.dev">
<meta property="og:description" content="Игры и ссылки Danielle Choster (Срань.dev)">
<meta property="og:image" content="avatar.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Danielle Choster — Срань.dev">
<meta name="twitter:description" content="Игры и ссылки Danielle Choster (Срань.dev)">
<meta name="twitter:image" content="avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:22px 10px 40px;color:#000;
  font:13px/1.45 Verdana,Tahoma,'DejaVu Sans',sans-serif;
  background:radial-gradient(ellipse at 50% 25%,#34343a,#060606 72%) fixed;
}
/* строчки ЭЛТ */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
a{color:inherit}
body.lang-en .i18n-ru,body:not(.lang-en) .i18n-en{display:none}
:focus-visible{outline:2px dotted #000;outline-offset:1px}

/* большое окно браузера */
.win{max-width:1000px;margin:0 auto;background:#c4c4c4;border:2px solid;border-color:#f2f2f2 #222 #222 #f2f2f2;box-shadow:0 0 0 1px #000,0 0 50px rgba(255,255,255,.1)}
.tbar{display:flex;justify-content:space-between;align-items:center;height:20px;padding:0 3px 0 7px;font-size:11px;background:linear-gradient(#fff,#b4b4b4);border-bottom:1px solid #444}
.tbar span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tbar i{display:flex;gap:2px;font-style:normal}
.tbar b{width:15px;height:13px;display:grid;place-items:center;font-size:10px;line-height:1;background:#d4d4d4;border:1px solid;border-color:#fff #555 #555 #fff}

/* шапка */
.banner{position:relative;height:190px;overflow:hidden;background:#000;border-bottom:2px solid #000}
.art{position:absolute;right:0;top:0;bottom:0;width:64%;display:flex;filter:grayscale(1) contrast(1.2) brightness(.75);-webkit-mask-image:linear-gradient(90deg,transparent,#000 50%);mask-image:linear-gradient(90deg,transparent,#000 50%)}
.art i{flex:1;background:center/cover;image-rendering:pixelated}
.banner h1{position:absolute;z-index:2;left:22px;top:50%;transform:translateY(-50%);max-width:92%;margin:0;
  font:800 clamp(32px,6.6vw,64px)/1.02 Rubik,'Arial Black',Arial,sans-serif;letter-spacing:-.01em;color:#fff;
  -webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:4px 4px 0 #000}
.player{display:flex;align-items:center;gap:9px;padding:5px 12px;background:#101010;color:#e8e8e8;font-size:12px;border-bottom:2px solid #000}
.player a{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-decoration:none}
.player a:hover{text-decoration:underline;color:#fff}

.body{display:grid;grid-template-columns:210px minmax(0,1fr);gap:10px;padding:10px}
aside,main{display:grid;gap:10px;align-content:start}
.in{border:2px solid;border-color:#fff #555 #555 #fff;background:#b6b6b6}
.out{border:2px solid;border-color:#555 #fff #fff #555;background:#d8d8d8}

/* навигация со звёздочками */
.hd{display:flex;justify-content:space-between;align-items:center;padding:4px 9px;font:700 14px Arial,Helvetica,sans-serif;text-transform:uppercase;background:linear-gradient(#f6f6f6,#8c8c8c);border-bottom:1px solid #333}
nav a{display:block;padding:5px 9px;font-size:12px;text-decoration:none;background:#bebebe;border-top:1px solid #e0e0e0;border-bottom:1px solid #8a8a8a}
nav a::before{content:"★ "}
nav a:hover,nav a:focus-visible{background:#fff}

/* мини-окна */
.mini .tbar{height:18px;background:linear-gradient(#fff,#a2a2a2)}
.mini .mb{padding:7px 9px;background:#d2d2d2}
.mini label{display:block;font-size:12px;cursor:pointer}
.mini input{margin:0 7px 0 0;accent-color:#222;vertical-align:-2px}
.b88{display:grid;place-items:center;width:88px;height:31px;margin:0 auto;padding:1px;text-align:center;text-decoration:none;color:#fff;font:700 11px/1.1 Arial,sans-serif;text-shadow:1px 1px #000;border:2px solid #000;outline:1px solid #fff;background:repeating-linear-gradient(45deg,#101010 0 4px,#3a3a3a 4px 8px)}
.b88:hover{filter:invert(1)}

/* приветствие */
.welcome{display:flex;align-items:center;gap:18px;padding:14px}
.pfp{position:relative;flex:none;width:150px;height:150px;display:grid;place-items:center;background:#e8e8e8;border:3px solid;border-color:#444 #fff #fff #444;font:700 40px Arial,sans-serif;color:#555}
.pfp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.wt{flex:1;text-align:center}
.wt h2{margin:0 0 8px;font:700 19px Arial,Helvetica,sans-serif}
.wt p{margin:0 0 12px}
.btn{display:inline-block;padding:6px 16px;font-weight:700;text-decoration:none;background:#cfcfcf;border:2px solid;border-color:#fff #444 #444 #fff;box-shadow:1px 1px 0 #000}
.btn:hover{background:#fff}.btn:active{border-color:#444 #fff #fff #444}

.sec{margin:6px 0 0;padding-bottom:5px;text-align:center;font:700 17px Arial,Helvetica,sans-serif;border-bottom:2px solid #777}

/* карточки игр */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box .bh{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font:700 14px Arial,Helvetica,sans-serif;text-transform:uppercase;background:linear-gradient(#ececec,#bcbcbc);border-bottom:2px solid #777}
.entry{display:block;padding:10px;text-decoration:none}
.shot{aspect-ratio:16/9;background:#000 center/cover;border:2px solid;border-color:#444 #fff #fff #444;image-rendering:pixelated}
.et{display:block;margin:9px 0 3px;font:700 16px Arial,Helvetica,sans-serif;text-decoration:underline}
.entry p{margin:0 0 5px}
.entry small{display:block;color:#3a3a3a}
.entry:hover{background:#e8e8e8}
.box.wide{grid-column:1/-1}
.box.wide .entry{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:14px;align-items:start}
.box.wide .et{margin-top:0}

.sbar{min-height:26px;padding:4px 10px;font-size:12px;background:#b8b8b8;border-top:2px solid #fff}

@media (max-width:820px){
  .body,.two,.box.wide .entry{grid-template-columns:1fr}
  .welcome{flex-direction:column}
  .banner{height:150px}
}
</style>
</head>
<body>

<div class="win h-card">
  <div class="tbar"><span>Danielle Choster — Срань.dev</span><i aria-hidden="true"><b>_</b><b>□</b><b>×</b></i></div>

  <header class="banner">
    <div class="art" id="art" aria-hidden="true"></div>
    <h1 class="p-name">Danielle Choster</h1>
  </header>

  <div class="player">
    <span aria-hidden="true">▶</span>
    <a class="u-url" rel="me noopener" href="https://t.me/Sran_Dev" target="_blank">
      <span class="i18n-ru">Сейчас в разработке: WHAT THE CAR — следить в тг-канале</span>
      <span class="i18n-en">Currently in development: WHAT THE CAR — follow the channel</span>
    </a>
    <span aria-hidden="true">♬</span>
  </div>

  <div class="body">
    <aside>
      <section class="in">
        <div class="hd"><span><span class="i18n-ru">Ссылки</span><span class="i18n-en">Links</span></span><span aria-hidden="true">✿</span></div>
        <nav id="nav"></nav>
      </section>

      <section class="in mini">
        <div class="tbar"><span>Language / Язык</span><i aria-hidden="true"><b>_</b><b>□</b><b>×</b></i></div>
        <div class="mb">
          <label><input type="radio" name="lg" value="ru">RU</label>
          <label><input type="radio" name="lg" value="en">EN</label>
        </div>
      </section>

      <section class="in mini">
        <div class="tbar"><span id="miniT"></span><i aria-hidden="true"><b>_</b><b>□</b><b>×</b></i></div>
        <div class="mb"><a class="b88" rel="me noopener" href="https://t.me/Sran_Dev" target="_blank">Danielle<br>Choster</a></div>
      </section>
    </aside>

    <main>
      <section class="out welcome">
        <div class="pfp">DC<img class="u-photo" src="avatar.png" alt="Danielle Choster" onerror="this.remove()"></div>
        <div class="wt" id="wt"></div>
      </section>

      <h2 class="sec"><span class="i18n-ru">Игры</span><span class="i18n-en">Games</span></h2>
      <div class="two" id="games"></div>
    </main>
  </div>

  <div class="sbar" id="sbar"></div>
</div>

<script>
const GAMES = [
  { title:"WHAT THE CAR", badge:{ru:"В разработке",en:"In development"},
    desc:{ru:"Бесконечное путешествие сквозь сотни миров на своей тачке. Телепортируйся, исследуй, кастомизируй авто.",en:"An endless journey through hundreds of worlds in your car. Teleport, explore, customize your ride."},
    url:"https://daniellechoster.itch.io/what-the-car", gif:"https://img.itch.zone/aW1nLzI5ODk2NzE0LmdpZg==/original/NYSPcY.gif",
    meta:{ru:"следить в тг-канале",en:"follow the channel"} },
  { title:"OUTPATIENT", badge:{ru:"Последнее демо",en:"Latest demo"},
    desc:{ru:"Бесконечная поездка на операционном столе: не рулишь, только стреляешь. Психоделический шутер про безумие и врачей.",en:"An endless ride on an operating table: you don't steer, you just shoot. A psychedelic shooter about madness and doctors."},
    url:"https://daniellechoster.itch.io/outpatient", gif:"https://img.itch.zone/aW1nLzI5ODgwNjkzLmdpZg==/original/Qxnvlh.gif",
    meta:{ru:"88 MB · Windows",en:"88 MB · Windows"} },
  { title:"LOOP PROTOCOL", badge:{ru:"4.9 ★ · 8 оценок",en:"4.9 ★ · 8 ratings"},
    desc:{ru:"Пиши код — смотри, как он оживает. Головоломка про программирование персонажа командами.",en:"Write code — watch it come to life. A puzzle game about programming your character with commands."},
    url:"https://daniellechoster.itch.io/loop-protocol", gif:"https://img.itch.zone/aW1nLzI3NDExMzIxLnBuZw==/original/zeFXv1.png",
    meta:{ru:"53 MB · Windows, Android",en:"53 MB · Windows, Android"} }
];
const LINKS = [
  { title:{ru:"Срань.dev",en:"Sran.dev"}, desc:{ru:"тг-канал студии — новости и апдейты",en:"studio's Telegram channel — news & updates"}, url:"https://t.me/Sran_Dev" },
  { title:{ru:"itch.io",en:"itch.io"}, desc:{ru:"все игры в одном месте",en:"all games in one place"}, url:"https://daniellechoster.itch.io/" },
  { title:{ru:"Личка",en:"DM"}, desc:{ru:"написать напрямую в тг",en:"message directly on Telegram"}, url:"https://t.me/DanielleChoster" },
  { title:{ru:"Discord",en:"Discord"}, desc:{ru:"написать в дискорде",en:"message on Discord"}, url:"https://discord.com/users/975382866122903582" },
  { title:{ru:"YouTube",en:"YouTube"}, desc:{ru:"видео и разработка",en:"videos & devlogs"}, url:"https://youtube.com/@dster_gmdv?si=H_LPjM1zBuVGGLkC" },
  { title:{ru:"TikTok",en:"TikTok"}, desc:{ru:"короткие клипы",en:"short clips"}, url:"https://www.tiktok.com/@danielle_choster?_r=1&_t=ZS-99tH59FkTQq" }
];
const bi = f => `<span class="i18n-ru">${f.ru}</span><span class="i18n-en">${f.en}</span>`;
const $ = id => document.getElementById(id);

/* картинки игр в шапке — чёрно-белые, как арт у Medjed */
$('art').innerHTML = [GAMES[1], GAMES[0]].map(g => `<i style="background-image:url('${g.gif}')"></i>`).join('');

$('nav').innerHTML = LINKS.map((l,i) => `<a href="${l.url}" target="_blank" rel="me noopener" data-d="${i}">${bi(l.title)}</a>`).join('');
$('miniT').innerHTML = bi(LINKS[0].title);

$('wt').innerHTML = `<h2>Danielle Choster</h2><p>${bi(LINKS[0].desc)}</p><a class="btn" href="${LINKS[0].url}" target="_blank" rel="me noopener">${bi(LINKS[0].title)}</a>`;

$('games').innerHTML = GAMES.map((g,i) => `
  <section class="out box ${i === 2 ? 'wide' : ''}">
    <div class="bh"><span>${bi(g.badge)}</span><span aria-hidden="true">★</span></div>
    <a class="entry" href="${g.url}" target="_blank" rel="noopener">
      <div class="shot" style="background-image:url('${g.gif}')"></div>
      <div><span class="et">${g.title}</span><p>${bi(g.desc)}</p><small>${bi(g.meta)}</small></div>
    </a>
  </section>`).join('');

/* строка состояния: © по умолчанию, описание ссылки при наведении */
const sbar = $('sbar');
const home = `© ${new Date().getFullYear()} Danielle Choster`;
sbar.textContent = home;
document.querySelectorAll('#nav a').forEach(a => {
  const on = () => { sbar.innerHTML = bi(LINKS[a.dataset.d].desc); };
  const off = () => { sbar.textContent = home; };
  a.addEventListener('mouseenter', on); a.addEventListener('focus', on);
  a.addEventListener('mouseleave', off); a.addEventListener('blur', off);
});

/* язык */
const radios = document.querySelectorAll('input[name="lg"]');
function setLang(lang){
  document.body.classList.toggle('lang-en', lang === 'en');
  document.documentElement.lang = lang;
  radios.forEach(r => { r.checked = r.value === lang; });
  try { localStorage.setItem('site-lang', lang); } catch(e){}
}
radios.forEach(r => r.addEventListener('change', () => setLang(r.value)));
let init = 'ru';
try {
  const s = localStorage.getItem('site-lang');
  if (s === 'ru' || s === 'en') init = s;
  else if ((navigator.language || '').toLowerCase().startsWith('en')) init = 'en';
} catch(e){}
setLang(init);
</script>
</body>
</html>
